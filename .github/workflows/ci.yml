name: CI

# Когда запускать
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Если в одну ветку прилетело несколько пушей подряд — старые прогоны
# отменяются, чтобы не жечь минуты впустую.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Линтеры
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==1.8.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Black (check)
        run: poetry run black --check .

      - name: isort (check)
        run: poetry run isort --check-only .

      - name: Ruff
        run: poetry run ruff check .

      - name: mypy
        run: poetry run mypy extractive_summarization service

  # 2. Тесты
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==1.8.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest -v

  # 3. Сборка Docker-образа
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: extractive-summarization:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
